<h2>你的参与程度？</h2>
<p class="subtitle">我需要知道哪些环节你能帮忙，哪些全交给我</p>

<div class="options" data-multiselect>

<div class="option" data-choice="domain" onclick="toggleSelect(this)">
  <div class="letter">A</div>
  <div class="content">
    <h3>域名 + 服务器</h3>
    <p>购买域名、VPS/云服务器、ICP 备案等，这些必须你来操作。</p>
    <span class="label">必须你</span>
  </div>
</div>

<div class="option" data-choice="accounts" onclick="toggleSelect(this)">
  <div class="letter">B</div>
  <div class="content">
    <h3>账号注册 + 实名认证</h3>
    <p>AdSense 申请、支付账号（支付宝/微信支付商户）、知乎账号。</p>
    <span class="label">必须你</span>
  </div>
</div>

<div class="option" data-choice="content-review" onclick="toggleSelect(this)">
  <div class="letter">C</div>
  <div class="content">
    <h3>内容审核 + 发布</h3>
    <p>我生成文章/教程，你过目后发布到知乎。也可全自动。</p>
    <span class="label">推荐你参与</span>
  </div>
</div>

<div class="option" data-choice="code-review" onclick="toggleSelect(this)">
  <div class="letter">D</div>
  <div class="content">
    <h3>代码审核 + 部署</h3>
    <p>我写代码，你审查后部署上线。也可全自动。</p>
    <span class="label">推荐你参与</span>
  </div>
</div>

<div class="option" data-choice="hands-off" onclick="toggleSelect(this)">
  <div class="letter">E</div>
  <div class="content">
    <h3>全部交给我</h3>
    <p>你只提供必要的账号密码/API Key，剩下我来搞定。你只管收钱。</p>
    <span class="label">最省心</span>
  </div>
</div>

</div>
